<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap');

        :root {
            --bg-color: #0b0710;
            --primary: #ff477e;
            --secondary: #ff7096;
            --glow: #ff85a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #2b1029 0%, #0b0710 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Loading / Intro Screen */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease;
        }

        .pulse-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            color: white;
            font-size: 1.5rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 20px var(--glow);
            animation: heartbeat 1.8s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--glow); }
            50% { transform: scale(1.1); box-shadow: 0 0 40px var(--primary); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--glow); }
        }

        /* Fireflies Background */
        .fireflies {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .firefly {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--glow);
            border-radius: 50%;
            box-shadow: 0 0 12px 3px var(--primary);
            animation: floatup 10s infinite ease-in-out;
        }

        @keyframes floatup {
            0% { transform: translateY(110vh) translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }

        /* Main Content */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 40px 15px;
            z-index: 2;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            color: #fff;
            text-align: center;
            text-shadow: 0 0 15px var(--glow), 0 0 30px var(--primary);
            margin-bottom: 5px;
            animation: dropDown 1s ease-out;
        }

        h2 {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffd1dc;
            margin-bottom: 60px;
            text-align: center;
        }

        @keyframes dropDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 3D Carousel */
        .scene {
            width: 280px;
            height: 350px;
            perspective: 1200px;
            margin-bottom: 80px;
        }

        .carousel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            animation: spin 24s infinite linear;
        }
        
        .carousel:hover {
            animation-play-state: paused;
        }

        .carousel-cell {
            position: absolute;
            width: 260px;
            height: 350px;
            left: 10px;
            top: 0;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 30px rgba(255, 71, 126, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
            -webkit-box-reflect: below 15px linear-gradient(transparent, transparent, rgba(0,0,0,0.4));
            transition: transform 0.5s;
        }

        .carousel-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 3D Positioning */
        .carousel-cell:nth-child(1) { transform: rotateY(0deg) translateZ(300px); }
        .carousel-cell:nth-child(2) { transform: rotateY(72deg) translateZ(300px); }
        .carousel-cell:nth-child(3) { transform: rotateY(144deg) translateZ(300px); }
        .carousel-cell:nth-child(4) { transform: rotateY(216deg) translateZ(300px); }
        .carousel-cell:nth-child(5) { transform: rotateY(288deg) translateZ(300px); }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* Typewriter Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            margin-top: 20px;
        }

        #typewriter-text {
            font-size: 1.2rem;
            line-height: 2;
            min-height: 180px;
            color: #f8f8f8;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--primary);
            margin-top: 30px;
            text-align: right;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }

        .signature.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .scene { transform: scale(0.65); margin-bottom: -10px; }
            .carousel-cell:nth-child(1) { transform: rotateY(0deg) translateZ(230px); }
            .carousel-cell:nth-child(2) { transform: rotateY(72deg) translateZ(230px); }
            .carousel-cell:nth-child(3) { transform: rotateY(144deg) translateZ(230px); }
            .carousel-cell:nth-child(4) { transform: rotateY(216deg) translateZ(230px); }
            .carousel-cell:nth-child(5) { transform: rotateY(288deg) translateZ(230px); }
        }
    </style>
</head>
<body>

    <!-- Glowing Fireflies Background -->
    <div class="fireflies" id="fireflies"></div>

    <!-- Intro / Lock Screen -->
    <div id="intro">
        <button class="pulse-btn" onclick="startExperience()">Tap to Open Your Surprise ✨</button>
    </div>

    <!-- Main Hidden Content -->
    <div id="main-content">
        <h1>Happy Birthday,<br> [Dear Tannu]</h1>
        <h2>My Universe, My Everything ,<br> Hamar Bandriya ,</h2>

        <!-- 3D Carousel -->
        <div class="scene">
            <div class="carousel">
                <div class="carousel-cell"><img src="d3.jpg" alt="Us 1"></div>
                <div class="carousel-cell"><img src="d5.jpg" alt="Us 2"></div>
                <div class="carousel-cell"><img src="d2.jpg" alt="Us 3"></div>
                <div class="carousel-cell"><img src="d4.jpg" alt="Us 4"></div>
                <div class="carousel-cell"><img src="d1.jpeg" alt="Us 5"></div>
            </div>
        </div>

        <!-- Glass Typewriter Card -->
        <div class="glass-card">
            <div id="typewriter-text"></div>
            <div class="signature" id="signature">Srif Aur Srif Tohar <br>[PatiDev]</div>
        </div>
    </div>

    <script>
        // Generate Fireflies
        const firefliesContainer = document.getElementById('fireflies');
        for (let i = 0; i < 40; i++) {
            let firefly = document.createElement('div');
            firefly.classList.add('firefly');
            firefly.style.left = Math.random() * 100 + 'vw';
            firefly.style.animationDuration = (Math.random() * 5 + 6) + 's';
            firefly.style.animationDelay = (Math.random() * 5) + 's';
            firefliesContainer.appendChild(firefly);
        }

        // The Letter Content - Edit this text!
        const letterContent = " Dear Kreja \n [Mission 48 Partner],\n\n Suna ye kareja Dhyan se tu hmar baat, I never want to wake up from. Tohke hast dekhila te hamme bahut accha lgala tu rowal ne kra Ham kitno mari tuhe .\n\nThank you for being the most incredible part of my life. Ham tohse wada karat bati ham tohre siva kahuk nahi dekhab , srif tuhi hamar hur ke pari hau .\n\nHappy Birthday, Hamar Kutiya .";

        // Start Experience & Typewriter Effect
        function startExperience() {
            // Hide intro screen
            const intro = document.getElementById('intro');
            const mainContent = document.getElementById('main-content');
            
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                mainContent.style.display = 'flex';
                
                // Trigger reflow to restart animations
                void mainContent.offsetWidth; 
                mainContent.style.opacity = '1';
                
                // Wait 1 second before starting to type the letter
                setTimeout(typeLetter, 1000);
            }, 800);
        }

        // Typewriter functionality
        let charIndex = 0;
        
        function typeLetter() {
            if (charIndex < letterContent.length) {
                let char = letterContent.charAt(charIndex);
                if (char === '\n') {
                    document.getElementById("typewriter-text").innerHTML += "<br>";
                } else {
                    document.getElementById("typewriter-text").innerHTML += char;
                }
                charIndex++;
                setTimeout(typeLetter, 45); // Adjust typing speed here (45ms per character)
            } else {
                // Show signature after typing is done
                setTimeout(() => {
                    document.getElementById('signature').classList.add('show');
                    burstConfetti();
                }, 800);
            }
        }

        // Confetti burst when the letter finishes
        function burstConfetti() {
            const emojis = ['✨', '💖', '🎉', '🌸'];
            for(let i=0; i<60; i++) {
                let confetti = document.createElement('div');
                confetti.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-50px';
                confetti.style.fontSize = Math.random() * 20 + 10 + 'px';
                confetti.style.zIndex = '999';
                confetti.style.transition = 'top 4s ease-in, opacity 4s ease-out';
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.style.top = '120vh';
                    confetti.style.opacity = '0';
                }, 50);
                
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
